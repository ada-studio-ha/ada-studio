name: Idea or request
description: Something Ada Studio could do, or do better
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What you would like
      description: What you want to obtain on your dashboard, more than how Ada Studio should do it.
    validations:
      required: true
  - type: textarea
    id: now
    attributes:
      label: How you do it today
      description: Workarounds, other cards or tools you use for it, if any.
  - type: textarea
    id: more
    attributes:
      label: Examples or screenshots
